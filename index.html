  <!-- Critical inline styles for enhanced boot screen -->
  <style>
    #boot-fallback {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #05060a 0%, #0a0c14 40%, #0d1020 70%, #12141f 100%);
      color: #f5f6fa;
      font-family: system-ui, -apple-system, sans-serif;
      flex-direction: column;
      gap: 20px;
      z-index: 1000;
      overflow: hidden;
    }

    /* Animated background grid */
    #boot-fallback::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,77,46,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,77,46,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
      pointer-events: none;
    }

    /* Noise texture overlay - cyberpunk grit */
    #boot-fallback::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.035;
      pointer-events: none;
      z-index: 5;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
      animation: noiseShift 8s steps(10) infinite;
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 60px 60px; }
    }

    @keyframes noiseShift {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-2%, -1%); }
      20% { transform: translate(1%, 2%); }
      30% { transform: translate(-1%, -2%); }
      40% { transform: translate(2%, 1%); }
      50% { transform: translate(-2%, 2%); }
      60% { transform: translate(1%, -1%); }
      70% { transform: translate(-1%, 1%); }
      80% { transform: translate(2%, -2%); }
      90% { transform: translate(-2%, -1%); }
    }

    /* Glow orbs - Enhanced dynamic animation */
    .boot-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: floatOrb 12s ease-in-out infinite;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .boot-orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #ff4d2e 0%, #ff2200 50%, transparent 70%);
      top: -200px; left: -150px;
      animation-delay: 0s;
      animation-name: floatOrb1;
    }

    .boot-orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #00e5ff 0%, #0088cc 50%, transparent 70%);
      bottom: -150px; right: -120px;
      animation-delay: -4s;
      animation-name: floatOrb2;
    }

    .boot-orb-3 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, #ffd23f 0%, #ff8c00 50%, transparent 70%);
      top: 40%; right: -80px;
      animation-delay: -7s;
      animation-name: floatOrb3;
      opacity: 0.2;
    }

    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.3; }
      20% { transform: translate(50px, 30px) scale(1.15) rotate(10deg); opacity: 0.45; }
      40% { transform: translate(20px, -40px) scale(0.9) rotate(-5deg); opacity: 0.25; }
      60% { transform: translate(-30px, 20px) scale(1.05) rotate(5deg); opacity: 0.4; }
      80% { transform: translate(-20px, -30px) scale(0.95) rotate(-10deg); opacity: 0.28; }
    }

    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.28; }
      25% { transform: translate(-40px, -30px) scale(1.12) rotate(-8deg); opacity: 0.42; }
      50% { transform: translate(30px, -50px) scale(0.88) rotate(12deg); opacity: 0.22; }
      75% { transform: translate(20px, 30px) scale(1.08) rotate(-6deg); opacity: 0.38; }
    }

    @keyframes floatOrb3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.18; }
      33% { transform: translate(-25px, 35px) scale(1.2); opacity: 0.3; }
      66% { transform: translate(15px, -25px) scale(0.85); opacity: 0.15; }
    }

    /* ============================================ */
    /* NEON PARTICLE SYSTEM - Pure CSS Performance */
    /* ============================================ */
    .particles-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      will-change: transform, opacity;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }

    /* Particle size variants - Enhanced dynamic range */
    .particle-xs { width: 2px; height: 2px; box-shadow: 0 0 4px currentColor, 0 0 8px currentColor; }
    .particle-sm { width: 3px; height: 3px; box-shadow: 0 0 5px currentColor, 0 0 10px currentColor; }
    .particle-md { width: 4px; height: 4px; box-shadow: 0 0 6px currentColor, 0 0 14px currentColor; }
    .particle-lg { width: 5px; height: 5px; box-shadow: 0 0 8px currentColor, 0 0 18px currentColor; }
    .particle-xl { width: 7px; height: 7px; box-shadow: 0 0 10px currentColor, 0 0 24px currentColor; }
    .particle-xxl { width: 10px; height: 10px; box-shadow: 0 0 14px currentColor, 0 0 30px currentColor; }

    /* Speed variants for particles */
    .speed-slow { animation-duration: 16s !important; }
    .speed-medium { animation-duration: 10s !important; }
    .speed-fast { animation-duration: 6s !important; }
    .speed-vfast { animation-duration: 4s !important; }

    /* Particle color variants - neon palette */
   .particle-orange {
      background: #ff4d2e;
      box-shadow: 0 0 6px #ff4d2e, 0 0 12px rgba(255, 77, 46, 0.5);
    }
    .particle-cyan {
      background: #00e5ff;
      box-shadow: 0 0 6px #00e5ff, 0 0 12px rgba(0, 229, 255, 0.5);
    }
    .particle-gold {
      background: #ffd23f;
      box-shadow: 0 0 6px #ffd23f, 0 0 12px rgba(255, 210, 63, 0.5);
    }
    .particle-magenta {
      background: #ff00aa;
      box-shadow: 0 0 6px #ff00aa, 0 0 12px rgba(255, 0, 170, 0.4);
    }
    .particle-white {
      background: #ffffff;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
    }

    /* Particle drift animations - varied paths */
    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      25% { transform: translate(30px, -40px) scale(1.2); opacity: 1; }
      50% { transform: translate(60px, 10px) scale(0.8); opacity: 0.5; }
      75% { transform: translate(20px, 50px) scale(1.1); opacity: 0.9; }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      25% { transform: translate(-40px, -30px) scale(0.9); opacity: 0.9; }
      50% { transform: translate(-70px, 20px) scale(1.15); opacity: 0.7; }
      75% { transform: translate(-30px, 60px) scale(0.85); opacity: 1; }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
      33% { transform: translate(50px, 30px) scale(1.1); opacity: 0.5; }
      66% { transform: translate(-20px, 70px) scale(0.9); opacity: 1; }
    }
    @keyframes drift4 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(-60px, -50px) scale(1.2); opacity: 1; }
    }
    @keyframes drift5 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
      50% { transform: translate(40px, 60px) scale(0.75); opacity: 0.4; }
    }
    @keyframes driftSlow {
      0%, 100% { transform: translate(0, 0); opacity: 0.4; }
      50% { transform: translate(25px, -20px); opacity: 0.8; }
    }

    /* ============================================ */
    /* SOPHISTICATED LOADER - Segmented Ring + Core */
    /* ============================================ */
    .loader-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
    }

    /* Outer segmented ring */
    .spinner-ring {
      width: 64px;
      height: 64px;
      position: relative;
    }

    .spinner-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #ff4d2e;
      border-right-color: #ff8c00;
      animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    /* Inner segmented track */
    .spinner-ring::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background:
        conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(0, 229, 255, 0.3) 30deg,
          transparent 60deg,
          transparent 120deg,
          rgba(255, 210, 63, 0.3) 150deg,
          transparent 180deg,
          transparent 240deg,
          rgba(255, 77, 46, 0.3) 270deg,
          transparent 300deg,
          transparent 360deg
        );
      animation: spin 2s linear infinite reverse;
    }

    /* Pulsing core */
    .loader-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      background: radial-gradient(circle, #fff 0%, #ffd23f 40%, #ff4d2e 100%);
      border-radius: 50%;
      animation: corePulse 1.5s ease-in-out infinite;
      box-shadow:
        0 0 10px #ff4d2e,
        0 0 20px rgba(255, 77, 46, 0.6),
        0 0 40px rgba(255, 77, 46, 0.3);
    }

    /* Core glow ring */
    .loader-core::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 210, 63, 0.4);
      animation: coreRing 2s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes corePulse {
      0%, 100% { 
        transform: scale(1); 
        opacity: 1;
        box-shadow: 0 0 10px #ff4d2e, 0 0 20px rgba(255, 77, 46, 0.6), 0 0 40px rgba(255, 77, 46, 0.3);
      }
      50% { 
        transform: scale(0.7); 
        opacity: 0.7;
        box-shadow: 0 0 15px #ffd23f, 0 0 30px rgba(255, 210, 63, 0.7), 0 0 50px rgba(255, 210, 63, 0.4);
      }
    }

    @keyframes coreRing {
      0%, 100% { 
        transform: scale(1); 
        opacity: 0.6;
        border-color: rgba(255, 210, 63, 0.4);
      }
      50% { 
        transform: scale(1.5); 
        opacity: 0.2;
        border-color: rgba(0, 229, 255, 0.3);
      }
    }

    /* Loading complete state */
    .loader-complete .loader-core {
      animation: coreComplete 0.5s ease-out forwards;
      background: radial-gradient(circle, #00ffa8 0%, #00e5ff 50%, #0088cc 100%);
      box-shadow: 0 0 15px #00ffa8, 0 0 30px rgba(0, 255, 168, 0.6);
    }

    .loader-complete .spinner-ring::before {
      border-top-color: #00ffa8;
      border-right-color: #00e5ff;
      animation-duration: 0.3s;
    }

    @keyframes coreComplete {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .boot-status {

    }

    .milestone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .milestone-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(18, 20, 31, 0.8);
      border: 1.5px solid #3a3e4a;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .milestone-dot.active {
      background: #ff4d2e;
      border-color: #ff4d2e;
      box-shadow: 0 0 12px rgba(255, 77, 46, 0.7), 0 0 24px rgba(255, 77, 46, 0.3);
    }

    .milestone-dot.active-blue {
      background: #00e5ff;
      border-color: #00e5ff;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.7), 0 0 24px rgba(0, 229, 255, 0.3);
    }

    .milestone-dot.active-purple {
      background: #a855f7;
      border-color: #a855f7;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.7), 0 0 24px rgba(168, 85, 247, 0.3);
    }

    .milestone-dot.active-green {
      background: #00ffa8;
      border-color: #00ffa8;
      box-shadow: 0 0 12px rgba(0, 255, 168, 0.7), 0 0 24px rgba(0, 255, 168, 0.3);
    }

    .milestone-dot.active-gold {
      background: #ffd23f;
      border-color: #ffd23f;
      box-shadow: 0 0 12px rgba(255, 210, 63, 0.7), 0 0 24px rgba(255, 210, 63, 0.3);
    }

    .milestone-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5a5e6a;
      transition: color 0.4s ease;
      white-space: nowrap;
    }

    .milestone.active .milestone-label {
      color: #a0a4b0;
    }

    /* ============================================ */
    /* ENHANCED LOADING COLOR STATES               */
    /* ============================================ */
    
    /* State 0-17%: Initializing (default orange) */
    .loader-state-init .spinner-ring::before {
      border-top-color: #ff4d2e;
      border-right-color: #ff8c00;
    }
    .loader-state-init .loader-core {
      background: radial-gradient(circle, #fff 0%, #ffd23f 40%, #ff4d2e 100%);
      box-shadow: 0 0 10px #ff4d2e, 0 0 20px rgba(255, 77, 46, 0.6), 0 0 40px rgba(255, 77, 46, 0.3);
    }
    .loader-state-init .boot-progress-bar {
      background: linear-gradient(90deg, #ff4d2e 0%, #ff8c00 50%, #ffd23f 100%);
      box-shadow: 0 0 15px rgba(255, 77, 46, 0.6);
    }

    /* State 18-27%: Loading 3D Engine (blue) */
    .loader-state-engine .spinner-ring::before {
      border-top-color: #00e5ff;
      border-right-color: #0088cc;
    }
    .loader-state-engine .loader-core {
      background: radial-gradient(circle, #fff 0%, #00e5ff 50%, #0088cc 100%);
      box-shadow: 0 0 10px #00e5ff, 0 0 20px rgba(0, 229, 255, 0.6), 0 0 40px rgba(0, 229, 255, 0.3);
    }
    .loader-state-engine .boot-progress-bar {
      background: linear-gradient(90deg, #00c4e8 0%, #00e5ff 50%, #80eeff 100%);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
    }

    /* State 28-41%: Config loading (purple) */
    .loader-state-config .spinner-ring::before {
      border-top-color: #a855f7;
      border-right-color: #7c3aed;
    }
    .loader-state-config .loader-core {
      background: radial-gradient(circle, #fff 0%, #c084fc 50%, #a855f7 100%);
      box-shadow: 0 0 10px #a855f7, 0 0 20px rgba(168, 85, 247, 0.6), 0 0 40px rgba(168, 85, 247, 0.3);
    }
    .loader-state-config .boot-progress-bar {
      background: linear-gradient(90deg, #9333ea 0%, #a855f7 50%, #d8b4fe 100%);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
    }

    /* State 42-69%: Assets loading (green) */
    .loader-state-assets .spinner-ring::before {
      border-top-color: #00ffa8;
      border-right-color: #059669;
    }
    .loader-state-assets .loader-core {
      background: radial-gradient(circle, #fff 0%, #34d399 50%, #00ffa8 100%);
      box-shadow: 0 0 10px #00ffa8, 0 0 20px rgba(0, 255, 168, 0.6), 0 0 40px rgba(0, 255, 168, 0.3);
    }
    .loader-state-assets .boot-progress-bar {
      background: linear-gradient(90deg, #059669 0%, #00ffa8 50%, #6ee7b7 100%);
      box-shadow: 0 0 15px rgba(0, 255, 168, 0.6);
    }

    /* State 70-99%: UI launching (gold) */
    .loader-state-ui .spinner-ring::before {
      border-top-color: #ffd23f;
      border-right-color: #f59e0b;
    }
    .loader-state-ui .loader-core {
      background: radial-gradient(circle, #fff 0%, #fcd34d 50%, #ffd23f 100%);
      box-shadow: 0 0 10px #ffd23f, 0 0 20px rgba(255, 210, 63, 0.6), 0 0 40px rgba(255, 210, 63, 0.3);
    }
    .loader-state-ui .boot-progress-bar {
      background: linear-gradient(90deg, #f59e0b 0%, #ffd23f 50%, #fef08a 100%);
      box-shadow: 0 0 15px rgba(255, 210, 63, 0.6);
    }

    /* Complete state: Green/Cyan celebration */
    .loader-complete.boot-state-complete .loader-core {
      background: radial-gradient(circle, #00ffa8 0%, #00e5ff 50%, #00ffa8 100%);
      box-shadow: 0 0 15px #00ffa8, 0 0 30px rgba(0, 255, 168, 0.6), 0 0 50px rgba(0, 229, 255, 0.3);
      animation: coreComplete 0.5s ease-out forwards, coreCelebration 1s ease-in-out 0.5s infinite;
    }

    .loader-complete.boot-state-complete .spinner-ring::before {
      border-top-color: #00ffa8;
      border-right-color: #00e5ff;
      animation-duration: 0.3s;
    }

    .loader-complete.boot-state-complete .boot-progress-bar {
      background: linear-gradient(90deg, #00ffa8 0%, #00e5ff 50%, #00ffa8 100%);
      box-shadow: 0 0 20px rgba(0, 255, 168, 0.8), 0 0 40px rgba(0, 229, 255, 0.4);
    }

    @keyframes coreCelebration {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.9; filter: brightness(1.2); }
    }

    .boot-percent {
      font-size: 11px;
      font-weight: 600;
      color: #ffd23f;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
      transition: color 0.3s ease;
    }

    /* Continue hint - shows after loading completes */
    .continue-hint {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: rgba(0, 229, 255, 0.06);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 999px;
      color: #00e5ff;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: hintGlow 2s ease-in-out infinite;
      cursor: default;
      user-select: none;
      transition: all 0.3s ease;
    }

    .continue-hint.visible {
      display: flex;
      animation: hintFadeIn 0.6s ease-out, hintGlow 2s ease-in-out infinite;
    }

    .continue-hint:hover {
      background: rgba(0, 229, 255, 0.12);
      border-color: rgba(0, 229, 255, 0.4);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
    }

    .continue-hint svg {
      width: 18px;
      height: 18px;
      animation: hintBounce 1.5s ease-in-out infinite;
    }

    @keyframes hintFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes hintGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.1); }
      50% { box-shadow: 0 0 35px rgba(0, 229, 255, 0.25); }
    }

    @keyframes hintBounce {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }
    
    .boot-error {
      color: #ff3d5a;
      max-width: 420px;
      text-align: center;
      padding: 24px;
      background: rgba(255, 61, 90, 0.08);
      border-radius: 16px;
      border: 1px solid rgba(255, 61, 90, 0.2);
      backdrop-filter: blur(10px);
    }

    .boot-tips {
      font-size: 11px;
      color: #5a5e6a;
      max-width: 360px;
      text-align: center;
      line-height: 1.7;
      margin-top: 8px;
    }

    .retry-btn {
      margin-top: 20px;
      padding: 14px 36px;
      background: linear-gradient(135deg, #ff4d2e, #ff8c00);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      box-shadow: 0 4px 24px rgba(255, 77, 46, 0.4);
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(255, 77, 46, 0.6);
    }

    /* Version badge */
    .version-badge {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #3a3e4a;
      text-transform: uppercase;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-badge::before {
      content: '';
      width: 4px;
      height: 4px;
      background: #00e5ff;
      border-radius: 50%;
      animation: versionPulse 2s ease-in-out infinite;
    }

    @keyframes versionPulse {
      0%, 100% { opacity: 0.5; box-shadow: 0 0 4px #00e5ff; }
      50% { opacity: 1; box-shadow: 0 0 8px #00e5ff; }
    }

    /* Scanline effect for extra cyberpunk feel */
    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      opacity: 0.5;
    }

    /* Vignette Effect Overlay */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      background: radial-gradient(
        ellipse at center,
        transparent 50%,
        rgba(0, 0, 0, 0.15) 80%,
        rgba(0, 0, 0, 0.4) 100%
      );
    }

    @media (prefers-reduced-motion: reduce) {
      .vignette-overlay {
        opacity: 0.7;
      }
    }

    /* Quick Start Button */
    .quick-start-btn {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      display: flex !important;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      font-family: var(--font-display, system-ui);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: var(--tracking-wide, 0.04em);
      color: #fff;
      background: linear-gradient(
        135deg,
        rgba(255, 77, 46, 0.9) 0%,
        rgba(255, 77, 46, 0.7) 100%
      );
      border: 1px solid rgba(255, 140, 0, 0.4);
      border-radius: var(--radius-pill, 999px);
      cursor: pointer;
      z-index: calc(var(--z-toast, 100) + 5);
      opacity: 0;
      visibility: hidden;
      transition: all var(--duration-base, 0.32s) cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 8px 32px rgba(255, 77, 46, 0.3),
        0 0 60px rgba(255, 77, 46, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .quick-start-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .quick-start-btn:hover {
      transform: translateX(-50%) translateY(-2px) scale(1.03);
      box-shadow:
        0 12px 40px rgba(255, 77, 46, 0.45),
        0 0 80px rgba(255, 77, 46, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      background: linear-gradient(
        135deg,
        rgba(255, 100, 70, 0.95) 0%,
        rgba(255, 77, 46, 0.85) 100%
      );
    }

    .quick-start-btn:active {
      transform: translateX(-50%) translateY(0) scale(0.98);
    }

    .quick-start-btn svg {
      width: 18px;
      height: 18px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .quick-start-btn span {
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Pulse animation for quick start when ready */
    @keyframes quickStartPulse {
      0%, 100% { 
        box-shadow:
          0 8px 32px rgba(255, 77, 46, 0.3),
          0 0 60px rgba(255, 77, 46, 0.15);
      }
      50% { 
        box-shadow:
          0 8px 40px rgba(255, 77, 46, 0.5),
          0 0 80px rgba(255, 77, 46, 0.25),
          0 0 120px rgba(255, 77, 46, 0.1);
      }
    }

    .quick-start-btn.visible {
      animation: quickStartPulse 2.5s ease-in-out infinite;
    }

    @media (max-width: 480px) {
      .quick-start-btn {
        padding: 12px 24px;
        font-size: 14px;
        bottom: 50px;
      }

      .quick-start-btn svg {
        width: 16px;
        height: 16px;
      }
    }

    /* ============================================ */
    /* LOADING TIPS SECTION - Cycles gameplay tips  */
    /* ============================================ */
    .loading-tips {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: linear-gradient(135deg, rgba(255, 210, 63, 0.08) 0%, rgba(255, 77, 46, 0.05) 100%);
      border: 1px solid rgba(255, 210, 63, 0.15);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 20;
      animation: tipSlideIn 0.8s ease-out both;
      max-width: min(420px, 85vw);
    }

    @keyframes tipSlideIn {
      from { 
        opacity: 0; 
        transform: translateX(-50%) translateY(20px); 
      }
      to { 
        opacity: 1; 
        transform: translateX(-50%) translateY(0); 
      }
    }

    .tips-icon {
      font-size: 18px;
      line-height: 1;
      animation: tipIconPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255, 210, 63, 0.5));
    }

    @keyframes tipIconPulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .tips-content {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .tip-text {
      font-size: 12px;
      color: #a0a4b0;
      letter-spacing: 0.03em;
      line-height: 1.5;
      white-space: nowrap;
      animation: textFadeCycle 6s ease-in-out infinite;
    }

    @keyframes textFadeCycle {
      0%, 80% { opacity: 1; }
      90%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Additional particle drift patterns for variety */
    @keyframes drift6 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      33% { transform: translate(60px, -25px) scale(1.3); opacity: 1; }
      66% { transform: translate(-40px, 45px) scale(0.8); opacity: 0.5; }
    }
    @keyframes drift7 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50% { transform: translate(-55px, -65px) scale(1.25); opacity: 1; }
    }

    /* ============================================ */
    /* AUDIO VISUALIZER BARS                       */
    /* ============================================ */
    .audio-visualizer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(calc(-50% + 120px));
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
      z-index: 15;
      opacity: 0.35;
      pointer-events: none;
    }

    .viz-bar {
      width: 3px;
      background: linear-gradient(180deg, 
        var(--viz-color-1, #ff4d2e) 0%, 
        var(--viz-color-2, #00e5ff) 100%
      );
      border-radius: 2px;
      animation: vizPulse 0.8s ease-in-out infinite alternate;
      transition: opacity 0.3s ease;
    }

    /* Varied heights and delays for organic feel */
    .viz-bar-1 { height: 40%; animation-delay: 0s; --viz-color-1: #ff4d2e; --viz-color-2: #ff8c00; }
    .viz-bar-2 { height: 65%; animation-delay: 0.08s; --viz-color-1: #ff4d2e; --viz-color-2: #ffd23f; }
    .viz-bar-3 { height: 45%; animation-delay: 0.15s; --viz-color-1: #ffd23f; --viz-color-2: #00ffa8; }
    .viz-bar-4 { height: 80%; animation-delay: 0.22s; --viz-color-1: #00ffa8; --viz-color-2: #00e5ff; }
    .viz-bar-5 { height: 55%; animation-delay: 0.30s; --viz-color-1: #00e5ff; --viz-color-2: #a855f7; }
    .viz-bar-6 { height: 90%; animation-delay: 0.38s; --viz-color-1: #a855f7; --viz-color-2: #ff4d2e; }
    .viz-bar-7 { height: 35%; animation-delay: 0.45s; --viz-color-1: #ff4d2e; --viz-color-2: #00e5ff; }
    .viz-bar-8 { height: 70%; animation-delay: 0.52s; --viz-color-1: #00e5ff; --viz-color-2: #ffd23f; }
    .viz-bar-9 { height: 50%; animation-delay: 0.60s; --viz-color-1: #ffd23f; --viz-color-2: #a855f7; }
    .viz-bar-10 { height: 85%; animation-delay: 0.68s; --viz-color-1: #a855f7; --viz-color-2: #00ffa8; }
    .viz-bar-11 { height: 42%; animation-delay: 0.75s; --viz-color-1: #00ffa8; --viz-color-2: #ff4d2e; }
    .viz-bar-12 { height: 60%; animation-delay: 0.82s; --viz-color-1: #ff4d2e; --viz-color-2: #ffd23f; }

    @keyframes vizPulse {
      0% { 
        transform: scaleY(0.3);
        opacity: 0.5;
      }
      100% { 
        transform: scaleY(1);
        opacity: 1;
      }
    }

    /* ============================================ */
    /* FPS/PERFORMANCE COUNTER                    */
    /* ============================================ */
    .fps-counter {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(18, 20, 31, 0.85);
      border: 1px solid rgba(255, 77, 46, 0.15);
      border-radius: 6px;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 11px;
      z-index: 25;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .fps-label {
      color: #5a5e6a;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .fps-value {
      color: #00ffa8;
      font-weight: 600;
      font-size: 12px;
      min-width: 36px;
      text-align: right;
      text-shadow: 0 0 8px rgba(0, 255, 168, 0.4);
      transition: color 0.3s ease;
    }

    .fps-value.loading {
      color: #ffd23f;
      text-shadow: 0 0 8px rgba(255, 210, 63, 0.4);
    }

    .fps-value.good {
      color: #00ffa8;
    }

    .fps-value.medium {
      color: #ffd23f;
    }

    .fps-value.poor {
      color: #ff4d2e;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .audio-visualizer {
        height: 16px;
        gap: 2px;
        bottom: 14px;
      }
      
      .viz-bar {
        width: 2px;
      }
      
      .fps-counter {
        top: 10px;
        right: 10px;
        padding: 4px 8px;
      }
      
      .fps-counter .fps-label,
      .fps-counter .fps-value {
        font-size: 9px;
      }
      
      .boot-milestones .milestone-label {
        font-size: 7px;
      }
      
      .boot-milestones .milestone-dot {
        width: 6px;
        height: 6px;
      }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      .viz-bar {
        animation: none;
        transform: scaleY(0.6);
      }
      
      .audio-visualizer {
        opacity: 0.2;
      }

      /* Disable ready celebration animations */
      .confetti-burst,
      .ready-text,
      .play-pulse-btn,
      .ready-flash-overlay {
        animation: none !important;
      }
    }

    /* ============================================ */
    /* KEYBOARD SHORTCUT HINTS PANEL               */
    /* ============================================ */
    .keyboard-hints-panel {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.08), rgba(255, 77, 46, 0.05));
      border: 1px solid rgba(0, 229, 255, 0.15);
      border-radius: var(--radius-l);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 25;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .keyboard-hints-panel.visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .keyboard-hint-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      font-size: 11px;
      color: #00e5ff;
      border: 1px solid rgba(0, 229, 255, 0.25);
    }

    .keyboard-hint-key {
      padding: 4px 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: #ffd23f;
      text-transform: uppercase;

  <script>
    // Update boot status text helper
    function setBootStatus(text) {
      var el = document.getElementById('boot-text');
      if (el) el.textContent = text;
    }

    function setBootPercent(pct) {
      var el = document.getElementById('boot-percent');
      if (el) el.textContent = Math.round(pct) + '%';
      
      // Update progress bar
      var progressBar = document.getElementById('boot-progress');
      if (progressBar) progressBar.style.width = pct + '%';
      
      // Update milestones and color states
      updateLoaderState(pct);
      
      // Auto-show continue hint when loading reaches 100%
      if (pct >= 100) {
        showContinueHint();
      }
    }

    /**
     * Updates loader visual state based on progress percentage.
     * Handles color scheme changes and milestone activation.
     * @param {number} pct - Current progress (0-100)
     */
    function updateLoaderState(pct) {
      var loaderContainer = document.querySelector('.boot-loader-container');
      var milestonesContainer = document.getElementById('boot-milestones');
      
      if (!loaderContainer) return;
      
      // Remove all state classes first
      loaderContainer.classList.remove(
        'loader-state-init', 
        'loader-state-engine', 
        'loader-state-config', 
        'loader-state-assets', 
        'loader-state-ui'
      );
      
      // Determine and apply state class
      var stateClass;
      var dotActiveClass;
      
      if (pct < 18) {
        stateClass = 'loader-state-init';
        dotActiveClass = 'active';
      } else if (pct < 28) {
        stateClass = 'loader-state-engine';
        dotActiveClass = 'active-blue';
      } else if (pct < 42) {
        stateClass = 'loader-state-config';
        dotActiveClass = 'active-purple';
      } else if (pct < 70) {
        stateClass = 'loader-state-assets';
        dotActiveClass = 'active-green';
      } else if (pct < 100) {
        stateClass = 'loader-state-ui';
        dotActiveClass = 'active-gold';
      } else {
        stateClass = 'loader-state-complete';
        dotActiveClass = 'active-gold';
      }
      
      loaderContainer.classList.add(stateClass);
      
      // Update milestone dots
      if (milestonesContainer) {
        var milestones = milestonesContainer.querySelectorAll('.milestone');
        milestones.forEach(function(milestone, index) {
          var threshold = parseInt(milestone.getAttribute('data-threshold')) || 0;
          var dot = milestone.querySelector('.milestone-dot');
          
          if (dot) {
            // Remove all active classes first
            dot.classList.remove(
              'active', 
              'active-blue', 
              'active-purple', 
              'active-green', 
              'active-gold'
            );
            
            // Activate if progress has reached threshold
            if (pct >= threshold) {
              // Use the appropriate color class for this milestone's stage
              var milestoneColorClasses = ['active-blue', 'active-purple', 'active-green', 'active-gold', 'active-gold'];
              dot.classList.add(index < milestoneColorClasses.length ? milestoneColorClasses[index] : 'active');
              milestone.classList.add('active');
            } else {
              milestone.classList.remove('active');
            }
          }
        });
      }
    }

    // Show continue hint with animation - called when loading completes
    function showContinueHint() {
      var loaderWrapper = document.getElementById('loader-wrapper');
      var continueHint = document.getElementById('continue-hint');
      var bootStatus = document.querySelector('.boot-status');
      var loaderContainer = document.querySelector('.boot-loader-container');
      
      if (loaderWrapper && !loaderWrapper.classList.contains('loader-complete')) {
        loaderWrapper.classList.add('loader-complete');
        
        // Set complete state on loader container
        if (loaderContainer) {
          loaderContainer.classList.remove(
            'loader-state-init', 
            'loader-state-engine', 
            'loader-state-config', 
            'loader-state-assets', 
            'loader-state-ui'
          );
          loaderContainer.classList.add('loader-state-complete');
        }
        
        // Update status text after short delay
        setTimeout(function() {
          if (bootStatus) bootStatus.innerHTML = '<span style="color: #00ffa8;">Ready</span>';
          
          // Show continue hint with fade-in
          if (continueHint) {
            continueHint.classList.add('visible');
          }
        }, 400);
      }
    }

    /**
     * Updates the FPS counter display
     * @param {number|null} fps - FPS value, or null for loading state
     */
    function updateFPSCounter(fps) {
      var fpsValueEl = document.getElementById('fps-value');
      if (!fpsValueEl) return;
      
      if (fps === null || fps === undefined) {
        fpsValueEl.textContent = 'INIT';
        fpsValueEl.className = 'fps-value loading';
      } else if (fps >= 60) {
        fpsValueEl.textContent = Math.round(fps);
        fpsValueEl.className = 'fps-value good';
      } else if (fps >= 30) {
        fpsValueEl.textContent = Math.round(fps);
        fpsValueEl.className = 'fps-value medium';
      } else {
        fpsValueEl.textContent = Math.round(fps);
        fpsValueEl.className = 'fps-value poor';
      }
    }

    // Initialize loader state on page load
    (function() {
      updateLoaderState(0);
      updateFPSCounter(null);
    })();

    // Handle user interaction to proceed (called by game engine or can be used standalone)
    function onBootInteraction(callback) {
      var hintEl = document.getElementById('continue-hint');
      if (hintEl && hintEl.classList.contains('visible') && typeof callback === 'function') {
        callback();
      }
    }

    // Listen for keyboard/tap events when ready
    (function() {
      var interacted = false;
      
      function handleInteraction(e) {
        if (interacted) return;
        var hintEl = document.getElementById('continue-hint');
        if (!hintEl || !hintEl.classList.contains('visible')) return;
        
        interacted = true;
        
        // Visual feedback on the hint
        hintEl.style.transform = 'scale(0.95)';
        hintEl.style.opacity = '0.7';
        
        // Dispatch custom event for main.js to pick up
        window.dispatchEvent(new CustomEvent('boot-continue', { 
          detail: { source: e.type } 
        }));
        
        // Reset visual state after delay
        setTimeout(function() {
          hintEl.style.transform = '';
          hintEl.style.opacity = '';
        }, 150);
      }
      
      // Keyboard listener
      document.addEventListener('keydown', handleInteraction);
      
      // Touch/click listener  
      document.addEventListener('touchstart', handleInteraction, { passive: true });
      document.addEventListener('click', handleInteraction);
    })();

    // Show a message if loading takes too long
    window.__bootTimeout = setTimeout(function() {
      var progress = document.getElementById('boot-progress');
      if (progress && parseFloat(progress.style.width || '0') < 85) {
        setBootStatus('Loading 3D resources');
        document.querySelector('.boot-status').style.color = '#ffb13d';
      }
    }, 20000);

    // Extreme timeout - show error with retry button
    window.__bootErrorTimeout = setTimeout(function() {
      var progress = document.getElementById('boot-progress');
      if (progress && parseFloat(progress.style.width || '0') < 98) {
        var container = document.getElementById('boot-fallback');
        if (container) {
          container.innerHTML = `
            <div class=\"boot-orb boot-orb-1\"></div>
            <div class=\"boot-content\">
              <div style=\"font-size: 48px; margin-bottom: 16px;\">⏱️</div>
              <div class=\"boot-error\">
                <h2 style=\"margin-bottom:12px;font-size:18px;color:#ff3d5a;\">Loading Taking Too Long</h2>
                <p style=\"color:#a0a4b0;margin-bottom:8px;\">The game resources are taking longer than expected.</p>
                <button class=\"retry-btn\" onclick=\"location.reload()\">🔄 Refresh Page</button>
              </div>
              <div class=\"boot-tips\">Tip: Check your internet connection or try refreshing the page.</div>
            </div>
            <div class=\"version-badge\">v0.2.0 · Timeout</div>
          `;
        }
      }
    }, 90000);

    // Expose functions globally for main.js integration
    window.bootScreenAPI = {
      setStatus: setBootStatus,
      setPercent: setBootPercent,
      showContinue: showContinueHint,
      isReady: function() { 
        var hintEl = document.getElementById('continue-hint');
        return hintEl && hintEl.classList.contains('visible'); 
      },
      updateFPS: updateFPSCounter,
      updateState: updateLoaderState
    };

    // ============================================
    // LOADING TIPS - Cycles through gameplay tips
    // ============================================
    (function() {
      var tips = [
        "Use boost pads on the track for extra speed!",
        "The grappling hook can swing you around corners faster.",
        "Collect power-ups by driving through item boxes on the track.",
        "Draft behind opponents to build speed, then slingshot past them!",
        "Each vehicle has unique stats - pick the one that fits your racing style.",
        "Time your boosts right before a jump for maximum air distance.",
        "Watch for shortcuts - some tracks have hidden paths!",
        "Use the brake while turning for sharper drift corners.",
        "Shields protect you from one hit - save them for critical moments.",
        "Missiles lock onto the nearest racer ahead of you."
      ];
      
      var currentTip = 0;
      var tipElement = document.getElementById('tip-text');
      
      if (tipElement) {
        setInterval(function() {
          currentTip = (currentTip + 1) % tips.length;
          
          // Fade out
          tipElement.style.opacity = '0';
          tipElement.style.transform = 'translateY(10px)';
          
          setTimeout(function() {
            tipElement.textContent = tips[currentTip];
            // Fade in
            tipElement.style.opacity = '1';
            tipElement.style.transform = 'translateY(0)';
          }, 400);
        }, 6000);
      }
    })();

    // ============================================
    // KEYBOARD HINTS PANEL - Shows after 10 seconds
    // ============================================
    (function() {
      var hintsPanel = document.getElementById('keyboard-hints');
      if (!hintsPanel) return;
      
      var hintsShown = false;
      
      function showKeyboardHints() {
        if (hintsShown || !hintsPanel) return;
        
        var progress = document.getElementById('boot-progress');
        var currentProgress = progress ? parseFloat(progress.style.width || '0') : 0;
        
        // Only show if loading hasn't completed yet
        if (currentProgress < 100) {
          hintsPanel.classList.add('visible');
          hintsShown = true;
        }
      }
      
      // Show keyboard hints after 10 seconds
      setTimeout(showKeyboardHints, 10000);
      
      // Hide when user interacts or loading completes
      document.addEventListener('boot-continue', function() {
        hintsPanel.classList.remove('visible');
      });
    })();

    // ============================================
    // ENHANCED READY STATE CELEBRATION
    // ============================================
    (function() {
      var celebrationTriggered = false;
      var celebrationContainer = document.getElementById('ready-celebration');
      var flashOverlay = document.getElementById('ready-flash');
      var playBtn = document.getElementById('play-pulse-btn');
      
      function triggerReadyCelebration() {
        if (celebrationTriggered || !celebrationContainer) return;
        celebrationTriggered = true;
        
        // Trigger background flash first
        if (flashOverlay) {
          flashOverlay.classList.add('flash');
        }
        
        // Show celebration container with slight delay for effect sequencing
        setTimeout(function() {
          if (celebrationContainer) {
            celebrationContainer.classList.add('active');
          }
          
          // Show Quick Start Button with slight delay after celebration appears
          var quickStartBtn = document.getElementById('quick-start-btn');
          if (quickStartBtn) {
            setTimeout(function() {
              quickStartBtn.classList.add('visible');
            }, 500);
          }
        }, 100);
        
        // Hide flash overlay after animation completes
        setTimeout(function() {
          if (flashOverlay) {
            flashOverlay.classList.remove('flash');
          }
        }, 1200);
      }
      
      // Play button click handler
      if (playBtn) {
        playBtn.addEventListener('click', function() {
          // Dispatch continue event to proceed to game
          window.dispatchEvent(new CustomEvent('boot-continue', { 
            source: 'play-button' 
          }));
        });
      }
      
      // Override showContinueHint to also trigger celebration
      var originalShowContinue = typeof showContinueHint === 'function' ? showContinueHint : null;
      if (originalShowContinue) {
        window.showContinueHintEnhanced = function() {
          originalShowContinue();
          triggerReadyCelebration();
        };
        
        // Hook into bootScreenAPI
        if (window.bootScreenAPI) {
          window.bootScreenAPI.showContinueEnhanced = function() {
            originalShowContinue();
            triggerReadyCelebration();
          };
        }
      }
    })();

    // ============================================
    // QUICK START BUTTON - Hide on interaction
    // ============================================
    (function() {
      document.addEventListener('boot-continue', function() {
        var btn = document.getElementById('quick-start-btn');
        if (btn) {
          btn.classList.remove('visible');
          // Fade out then hide completely
          setTimeout(function() {
            btn.style.display = 'none';
          }, 300);
        }
      });
    })();

    // ============================================
    // KONAMI CODE EASTER EGG - Cheat Mode!
    // Code: ↑ ↑ ↓ ↓ ← → ← → B A
    // ============================================
    (function() {
      // The famous Konami code sequence
      var konamiCode = [
        'ArrowUp', 'ArrowUp', 
        'ArrowDown', 'ArrowDown', 
        'ArrowLeft', 'ArrowRight', 
        'ArrowLeft', 'ArrowRight', 
        'KeyB', 'KeyA'
      ];
      
      var konamiIndex = 0;
      var cheatMessageEl = document.getElementById('cheat-mode-message');
      var cheatActivated = false;
      
      function handleKonamiInput(e) {
        // Ignore if inside input fields
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        
        // Check if current key matches expected key in sequence
        if (e.code === konamiCode[konamiIndex]) {
          konamiIndex++;
          
          // Full sequence completed!
          if (konamiIndex === konamiCode.length) {
            activateCheatMode();
            konamiIndex = 0; // Reset for re-triggering
          }
        } else {
          // Reset on wrong key (allow starting over)
          konamiIndex = 0;
          // Check if the current wrong key is actually the start of a new sequence
          if (e.code === konamiCode[0]) {
            konamiIndex = 1;
          }
        }
      }
      
      function activateCheatMode() {
        if (!cheatMessageEl || cheatActivated) return;
        cheatActivated = true;
        
        // Show cheat mode message with animation
        cheatMessageEl.classList.add('active');
        
        // Log to console for developers
        console.log('%c🎮 CHEAT MODE ACTIVATED! 🎮', 'color: #a855f7; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #a855f7;');
        console.log('%cSecret commands enabled! You found the Konami code!', 'color: #ffd23f; font-size: 12px;');
        
        // Dispatch custom event for game engine to listen
        window.dispatchEvent(new CustomEvent('cheat-mode-activated', {
          detail: { timestamp: Date.now(), code: 'konami' }
        }));
        
        // Reset after animation completes so it can be triggered again
        setTimeout(function() {
          cheatMessageEl.classList.remove('active');
          cheatActivated = false;
        }, 3000);
      }
      
      // Listen for keyboard events
      document.addEventListener('keydown', handleKonamiInput);
    })();
  </script>
